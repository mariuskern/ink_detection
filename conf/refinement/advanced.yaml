name: "base"
debug: false
steps:
  - name: threshold
    threshold: 0.5

  - name: confidence_mask
    threshold: 0.8 # 0.8 0.9 0.95

  - name: uncertainty_mask
    threshold: 0.15 # 0.15 0.05 0.05
  
  - name: remove_small_objects
    min_size: 200000 # 1000              # 1667: 200000; 0172: 20000
    connectivity: 4
    update_mask: true