name: "base"
debug: false
steps:
  - name: threshold
    threshold: 0.5

  - name: confidence_mask
    threshold: 0.8 # 0.8 0.9 0.95

  - name: uncertainty_mask
    threshold: 0.15 # 0.15 0.05 0.05
  
  - name: remove_small_objects
    max_size: 500
    connectivity: 1

  - name: binary_closing
    kernel_size: 5
    iterations: 1