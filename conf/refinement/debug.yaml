name: "debug"
debug: true
steps:
  - name: threshold
    threshold: 0.8

  - name: confidence_mask
    threshold: 0.8 # 0.8 0.9 0.95

  - name: uncertainty_mask
    threshold: 0.15 # 0.15 0.05 0.05
  
  - name: remove_small_objects
    min_size: 20000 # 1000
    connectivity: 4
    update_mask: true
  
  - name: binary_closing
    kernel_size: 25
    iterations: 1
    probability_threshold: 0
    update_mask: false