# @package _global_

defaults:
  - pre_a1
  - _self_

train:
  model_schedule:
    - /pre_ablations/pre_a/unetrpp_small
    - /pre_ablations/pre_a/unetrpp_medium
    - /pre_ablations/pre_a/unetrpp_large
  refinement:
    name: weak
    steps:
      - name: threshold
        threshold: 0.5

      - name: confidence_mask
        threshold: 0.7
        update_label: true

      - name: uncertainty_mask
        threshold: 0.2
        update_label: true

experiment:
  name: pre_a40_increasing_model_size_weak_pseudo_refinement_seed_${train.seed}_${oc.env:SLURM_JOB_ID,local}
