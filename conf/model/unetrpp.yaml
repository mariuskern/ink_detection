name: unetrpp
feature_size: 16
hidden_size: 256
num_heads: 4
norm_name: "instance"
depths: [3, 3, 3, 3]
decoder_depths: [3, 3, 3]           # Transformer blocks in decoder5, decoder4, decoder3 (deep -> shallow)
dims: [32, 64, 128, 256]
patch_size: [1, 4, 4]
proj_size: [64, 64, 64, 32]
encoder_dropout_rate: 0.0           # Original: 0.0
attention_dropout_rate: 0.15        # Original: 0.15
conv_dropout_rate: 0.0              # Original: 0.0
conv_projection_dropout_rate: 0.1   # Original: 0.1
drop_path_rate: 0.1                 # Original: 0.0
pe_mode: 2d
depth_attn: True
da_gamma_init: 0.1
surface_relative: True
per_pixel: True
warp_stabilize: True
# Stem
texture_stem: True
stem_out_extra: 8
# Collapse
collapse: surface_relative
# Head
head_classes: 1
