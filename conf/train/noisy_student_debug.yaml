defaults:
  - noisy_student
  - override /aug@teacher: tta_debug
  - override /refinement@refinement: debug

max_epochs: 5
warmup_epochs: 0
val_image_every_n_epochs: 1
checkpoint:
  monitor: metrics_val/dice
  mode: max
  save_top_k: 2
  swa_save_k: 2

iterations: 4
model_schedule: null # [unetrpp_small, unetrpp_small, unetrpp_medium, unetrpp_large] null


# Start new run

start_iteration: 0
teacher_checkpoint: auto
resume_output_dir: auto
resume_run: auto


