  - /aug@student.aug: strong # strong strong_v2
  - /refinement@refinement: base # base advanced

name: noisy_student
pseudo_target: soft # hard | soft
iterations: 5

mask_refinement:
  enabled: true
  targets: [real]             # real, pseudo, or both
  pseudo_threshold: 0.5       # Threshold used for soft pseudo targets.
  margin: null                # Fixed pixel radius; overrides margin_factor when set.
  margin_factor: 0.25         # Radius relative to robust median component size.
  closing_radius: null        # Fixed closing radius; overrides closing_factor.
  closing_factor: 0.4         # 0 disables closing.
  closing_method: auto        # auto, opencv, distance
  chunk_size: 2048
  progress: false

start_iteration: 0
teacher_checkpoint: auto
resume_output_dir: auto
resume_run: auto

