lr: 1.0e-4 # 1.0e-4 5.0e-5
max_epochs: 50
weight_decay: 3.0e-5
warmup_epochs: 3 # 3 5
accelerator: auto
# devices: 1
gradient_clip_val: 1.0
gradient_clip_algorithm: "norm"
precision: bf16-mixed                 # 16-true 16-mixed bf16-true bf16-mixed 32-true

# Increasing student sizes crashed with reduce-overhead unless caches were cleared.
# Prefer default with cache reuse; clearing caches forces recompilation each iteration.
compile: true                         # Set this to false when debugging model code, where compilation errors are easier to read.
compile_mode: default                 # default reduce-overhead
predict_compile_mode: default         # Used by predict when compile is true; avoids reduce-overhead's extra CUDA-graph workspace.
compile_clear_caches: false

val_image_every_n_epochs: 10          # 0 disables validation image export.
val_segment_metrics_every_n_epochs: 1 # 0 disables segment Dice/IoU.
seed: 42 # null 42
checkpoint:
  checkpoint_every_n_epochs: 1
  save_top_k: 1
  swa_save_k: 5
  save_last: True
  save_last_every_epoch: True
  monitor: val/loss                   # val/loss train/loss
  mode: min
  additional_monitors:                # Metric key -> min/max; {} disables additional checkpoints.
    val/loss: min
    metrics_val/iou: max
    metrics_val/dice: max
    metrics_val/precision: max
    metrics_val/recall: max
    metrics_val/f0_5: max
    metrics_val/f1_5: max
    metrics_val/f2: max
benchmark: false
deterministic: true
threshold: 0.5                        # Used to calculate dice and iou
gradient_accumulation_steps: 1
use_validation_mask: false

pseudo_target: soft # hard | soft
pseudo_positive_threshold: 0.5 # Pixel threshold for soft pseudo-label tile statistics.

label_refinement:
  enabled: false
  targets: [real]             # real, pseudo, or [real, pseudo].
  radius: null                # Fixed pixels; overrides radius_factor.
  radius_factor: 0.08         # Relative to median component size.
  min_value: 0.5              # Target value at the foreground boundary.
  smooth_background: true     # Also soften background near ink.
  chunk_size: 2048
  progress: false

mask_refinement:
  enabled: false
  apply_to_val: false         # Also apply mask refinement to validation segments.
  targets: [real]             # real, pseudo, or both
  pseudo_threshold: 0.5       # Threshold used for soft pseudo targets.
  margin: null                # Fixed pixel radius; overrides margin_factor when set.
  margin_factor: 0.25         # Radius relative to robust median component size.
  closing: null               # Fixed closing radius; overrides closing_factor.
  closing_factor: 0.4         # 0 disables closing.
  closing_method: auto        # auto, opencv, distance
  chunk_size: 2048
  progress: false

