lr: 1.0e-4 # 1.0e-4 5.0e-5
max_epochs: 50
weight_decay: 3.0e-5
warmup_epochs: 3 # 3 5
accelerator: auto
# devices: 1
gradient_clip_val: 1.0
gradient_clip_algorithm: "norm"
precision: bf16-mixed                 # 16-true 16-mixed bf16-true bf16-mixed 32-true

# Increasing student sizes crashed with reduce-overhead unless caches were cleared.
# Prefer default with cache reuse; clearing caches forces recompilation each iteration.
compile: true                         # Set this to false when debugging model code, where compilation errors are easier to read.
compile_mode: default                 # default reduce-overhead
predict_compile_mode: default         # Used by predict when compile is true; avoids reduce-overhead's extra CUDA-graph workspace.
compile_clear_caches: false

val_image_every_n_epochs: 10          # 0 disables validation image export.
val_segment_metrics_every_n_epochs: 1 # 0 disables segment Dice/IoU.
seed: 42 # null 42
checkpoint:
  checkpoint_every_n_epochs: 1
  save_top_k: 1
  swa_save_k: 5
  save_last: True
  save_last_every_epoch: True
  monitor: val/loss                   # val/loss train/loss
  mode: min
  additional_monitors:                # Metric key -> min/max; {} disables additional checkpoints.
    val/loss: min
    val/segment_iou: max
    val/segment_dice: max
    val/segment_precision: max
    val/segment_recall: max
    val/segment_f0_5: max
    val/segment_f1_5: max
    val/segment_f2: max
benchmark: false
deterministic: true
threshold: 0.5                        # Used to calculate dice and iou
gradient_accumulation_steps: 1
use_validation_mask: false
