lr: 1.0e-4 # 1.0e-4
max_epochs: 50
weight_decay: 3.0e-5
warmup_epochs: 5
accelerator: auto
devices: 1
gradient_clip_val: 1.0
gradient_clip_algorithm: "norm"
checkpoint_every_n_epochs: 1
precision: bf16-mixed # 16-true 16-mixed bf16-true bf16-mixed 32-true
compile: false # Set this to false when debugging model code, where compilation errors are easier to read.
compile_mode: reduce-overhead
val_image_every_n_epochs: 10
seed: 42
save_top_k: 1
benchmark: True
deterministic: False
