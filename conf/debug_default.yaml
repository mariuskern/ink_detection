defaults:
  - data/dataset@dataset: debug
  - data/sampler@sampler: debug
  - data/dataloader@dataloader: debug
  - model: unetrpp_large # timesformer unetrpp vesuvius_unet vesuvius_resnet3d
  - loss: dice_bce
  - path: local
  - wandb: debug
  - train: noisy_student_debug # supervised_debug noisy_student_debug noisy_student_debug_resnet3d noisy_student_debug_unet unimatch_debug
  - _self_

experiment:
  name: ${now:%Y-%m-%d_%H-%M-%S} # ${model.name}_${now:%Y-%m-%d_%H-%M-%S}
  jobid: ${oc.env:SLURM_JOB_ID,none}

hydra:
  output_subdir: null # train.py archives and saves .hydra before training.
  run:
    dir: ${path.output_dir}
