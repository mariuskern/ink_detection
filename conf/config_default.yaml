defaults:
  - data/dataset@dataset: default
  - data/sampler@sampler: default
  - data/dataloader@dataloader: default
  - model: unetrpp_large # timesformer unetrpp vesuvius_unet vesuvius_resnet3d
  - loss: dice_bce
  - path: alex
  - wandb: default
  - train: noisy_student # supervised noisy_student noisy_student_resnet3d noisy_student_undet unimatch
  - _self_

experiment:
  name: ${now:%Y-%m-%d_%H-%M-%S}_${oc.env:SLURM_JOB_ID,local}
  jobid: ${oc.env:SLURM_JOB_ID,none}

hydra:
  output_subdir: null # train.py archives and saves .hydra before training.
  run:
    dir: ${path.output_dir}
