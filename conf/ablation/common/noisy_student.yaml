# @package _global_

train:
  teacher:
    tta_num: 1
    use_top_k: true
    top_k_mode: individual
    use_swa: false
    swa_mode: average
    aug:
      variants: []
  refinement:
    name: base
    debug: false
    steps:
      - name: threshold
        threshold: 0.5

      - name: confidence_mask
        threshold: 0.8
        update_label: true

      - name: uncertainty_mask
        threshold: 0.15
        update_label: true
  name: noisy_student
  iterations: 6
  model_schedule: null
  start_iteration: 1
  teacher_checkpoint: ${ablation.teacher_root}/${ablation.baseline_id}_${ablation.noise}/seed_${train.seed}/checkpoints
  resume_output_dir: auto
  resume_run: auto
