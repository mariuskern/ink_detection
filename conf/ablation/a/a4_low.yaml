# @package _global_

defaults:
  - noisy_student
  - model_small_low@model
  - input_noise_low@train.student.aug
  - _self_

ablation:
  id: a4
  noise: low
  baseline_id: a0

train:
  # Index 0 restores the S teacher; students use M, L, L, L at 1..4.
  model_schedule:
    - /ablation/a/model_small_low
    - /ablation/a/model_medium_low
    - /ablation/a/model_large_low
    - /ablation/a/model_large_low
    - /ablation/a/model_large_low
