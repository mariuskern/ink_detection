  - /ablation/b2/b3_low
  - _self_

train:
  seed: 42
  iterations: 6
  start_iteration: 5
  teacher_checkpoint: auto
  resume_output_dir: outputs_ws/ablation_b2/noisy_student/b3_low/seed_42_time_20261125_025646_242405_job_id_5070575_task_0
  resume_run: auto
