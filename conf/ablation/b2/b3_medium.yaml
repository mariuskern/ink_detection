# @package _global_

defaults:
  - noisy_student
  - /ablation/common/model_small_medium@model
  - /ablation/common/input_noise_medium@train.student.aug
  - _self_

ablation:
  id: b3
  noise: medium
  baseline_id: a0

train:
  teacher:
    use_top_k: false
    top_k_mode: average
    use_swa: true
    swa_mode: individual
  # Index 0 restores the S teacher; students use M, L, L, L at 1..4.
  model_schedule:
    - /ablation/common/model_small_medium
    - /ablation/common/model_medium_medium
    - /ablation/common/model_large_medium
    - /ablation/common/model_large_medium
    - /ablation/common/model_large_medium
