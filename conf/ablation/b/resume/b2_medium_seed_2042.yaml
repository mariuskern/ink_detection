# @package _global_

# Resume the existing B run from the saved teacher at iteration 5.
# All B runs finish at iteration 6 (baseline 0 + six student iterations).
# Submit with slurm_job_scripts/train.sbatch; this config fixes its own seed.
defaults:
  - /ablation/b/b2_medium
  - _self_

train:
  seed: 2042
  iterations: 7
  start_iteration: 6
  teacher_checkpoint: auto
  resume_output_dir: outputs_ws/ablation_b/noisy_student/b2_medium/seed_2042_time_20261113_002008_547797_job_id_4992057_task_2
  resume_run: auto
