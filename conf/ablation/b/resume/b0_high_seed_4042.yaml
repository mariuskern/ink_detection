# All B runs finish at iteration 6 (baseline 0 + six student iterations).
# Submit with slurm_job_scripts/train.sbatch; this config fixes its own seed.
defaults:
  - /ablation/b/b0_high
  - _self_

train:
  seed: 4042
  iterations: 7
  start_iteration: 6
  teacher_checkpoint: auto
  resume_output_dir: outputs_ws/ablation_b/noisy_student/b0_high/seed_4042_time_20261114_170958_385864_job_id_4991824_task_4
  resume_run: auto
