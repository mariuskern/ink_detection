# @package _global_

# Resume the existing B run from the saved teacher at iteration 4.
# All B runs finish at iteration 6 (baseline 0 + six student iterations).
# Submit with slurm_job_scripts/train.sbatch; this config fixes its own seed.
defaults:
  - /ablation/b/b1_high
  - _self_

train:
  seed: 3042
  iterations: 7
  start_iteration: 5
  teacher_checkpoint: auto
  resume_output_dir: outputs_ws/ablation_b/noisy_student/b1_high/seed_3042_time_20261112_224909_703288_job_id_4991709_task_3
  resume_run: auto
