# @package _global_

# Resume the existing B run from the saved teacher at iteration 4.
# All B runs finish at iteration 6 (baseline 0 + six student iterations).
# Submit with slurm_job_scripts/train.sbatch; this config fixes its own seed.
defaults:
  - /ablation/b/b3_high
  - _self_

train:
  seed: 2042
  iterations: 7
  start_iteration: 5
  teacher_checkpoint: auto
  resume_output_dir: outputs_ws/ablation_b/noisy_student/b3_high/seed_2042_time_20261115_005207_502292_job_id_5005035_task_2
  resume_run: auto
