# @package _global_

# Ablation A A3 with medium noise and shared more_data splits.
# Checkpoint-selection and resume variants inherit the data through this base.

defaults:
  - data
  - _self_

dataset:
  tile_size: 192
  stride: 96
  n_layers: 65
  center: 32
  depth: 32
  norm: global
  min_mask_fraction: 0.5
sampler:
  mode: balanced
  alpha: 5.0
  num_samples: 4000
  pos_threshold: 0.05
  real_fraction: 0.5
  limit_pseudo_tiles: true
dataloader:
  batch_size: 15
  predict_batch_size: 80
  shuffle: false
  num_workers: 8
  pin_memory: true
  prefetch_factor: 1
  persistent_workers: true
loss:
  name: dice_bce
  w: 0.5
  eps: 1.0e-06
  bce_label_smoothing: 0
  dice_label_smoothing: 0
path:
  stage_dir: ${oc.env:DATA_DIR}/data_tar
  data_dir: ${oc.env:TMPDIR}/data_zarr
  tmp_dir: ${oc.env:TMP_DIR}/experiments/more_data/${experiment.name}
  output_dir: ${training_output_dir:${oc.select:train.resume_output_dir,null},${oc.env:OUTPUT_DIR}/experiments/more_data/${experiment.name},${oc.select:train.teacher_checkpoint,null},${oc.select:train.start_iteration,0}}
wandb:
  project: ink_more_data
  group: null
  name: null
  notes: null
train:
  lr: 0.0001
  max_epochs: 50
  weight_decay: 3.0e-05
  warmup_epochs: 3
  accelerator: auto
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  precision: bf16-mixed
  compile: true
  compile_mode: default
  predict_compile_mode: default
  compile_clear_caches: false
  val_image_every_n_epochs: 10
  val_segment_metrics_every_n_epochs: 1
  seed: 42
  checkpoint:
    checkpoint_every_n_epochs: 1
    save_top_k: 1
    swa_save_k: 1
    save_last: true
    save_last_every_epoch: true
    monitor: metrics_val/dice
    mode: max
    additional_monitors:
      val/loss: min
      metrics_val/iou: max
      metrics_val/dice: max
      metrics_val/precision: max
      metrics_val/recall: max
      metrics_val/f0_5: max
      metrics_val/f1_5: max
      metrics_val/f2: max
  benchmark: false
  deterministic: false
  threshold: 0.5
  gradient_accumulation_steps: 1
  use_validation_mask: false
  pseudo_target: soft
  pseudo_positive_threshold: 0.5
  label_refinement:
    enabled: false
    targets:
    - real
    radius: null
    radius_factor: 0.08
    min_value: 0.5
    smooth_background: true
    chunk_size: 2048
    progress: false
  mask_refinement:
    enabled: true
    apply_to_val: true
    targets:
    - real
    pseudo_threshold: 0.5
    margin: null
    margin_factor: 0.25
    closing: null
    closing_factor: 0.4
    closing_method: auto
    chunk_size: 2048
    progress: false
  teacher:
    tta_num: 1
    use_top_k: true
    top_k_mode: individual
    use_swa: false
    swa_mode: average
    aug:
      variants: []
  refinement:
    name: base
    debug: false
    steps:
    - name: threshold
      threshold: 0.5
    - name: confidence_mask
      threshold: 0.8
      update_label: true
    - name: uncertainty_mask
      threshold: 0.15
      update_label: true
  name: noisy_student
  iterations: 5
  model_schedule: null
  start_iteration: 0
  teacher_checkpoint: null
  resume_output_dir: auto
  resume_run: auto
  student:
    aug:
      name: input_noise_medium
      transforms:
      - name: random_horizontal_flip
        p: 0.5
      - name: random_vertical_flip
        p: 0.5
      - name: random_affine
        degrees: 20
        translate:
        - 0.05
        - 0.05
        scale:
        - 0.9
        - 1.1
        shear: 5
        p: 0.5
      - name: tps
        grid_size: 4
        strength: 0.03
        keep_boundary: true
        padding_mode: border
        chunk_size: 4096
        p: 0.2
      - name: gaussian_noise
        mean: 0.0
        sigma: 0.05
        p: 0.3
      - name: random_resized_crop
        size: ${dataset.tile_size}
        scale:
        - 0.8
        - 1.0
        ratio:
        - 0.9
        - 1.1
        p: 0.5
experiment:
  checkpoint_selection: standard_dice
  name: a3_medium_${experiment.checkpoint_selection}_more_data_seed_${train.seed}_${now:%Y%m%d_%H%M%S_%f}_${oc.env:SLURM_JOB_ID,local}_task_${oc.env:SLURM_ARRAY_TASK_ID,none}
  jobid: ${oc.env:SLURM_JOB_ID,none}_${oc.env:SLURM_ARRAY_TASK_ID,none}
model:
  name: unetrpp
  feature_size: 16
  hidden_size: 256
  num_heads: 4
  norm_name: instance
  depths:
  - 3
  - 3
  - 3
  - 3
  decoder_depths:
  - 3
  - 3
  - 3
  dims:
  - 32
  - 64
  - 128
  - 256
  patch_size:
  - 1
  - 4
  - 4
  proj_size:
  - 64
  - 64
  - 64
  - 32
  encoder_dropout_rate: 0.0
  attention_dropout_rate: 0.15
  conv_dropout_rate: 0.0
  conv_projection_dropout_rate: 0.1
  drop_path_rate: 0.1
  pe_mode: 2d
  depth_attn: true
  da_gamma_init: 0.1
  surface_relative: true
  per_pixel: true
  warp_stabilize: true
  texture_stem: true
  stem_out_extra: 8
  collapse: surface_relative
  head_classes: 1
hydra:
  output_subdir: null
  run:
    dir: ${path.output_dir}
