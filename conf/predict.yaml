defaults:
  - data/dataset@dataset: default # default resnet3d
  - data/dataloader@dataloader: debug # default debug
  - model: unetrpp # timesformer unetrpp vesuvius_unet vesuvius_resnet3d
  - path: predict
  - /aug@: tta_none
  - _self_

experiment:
  name: ${now:%Y-%m-%d_%H-%M-%S}
  jobid: ${oc.env:SLURM_JOB_ID,none}

hydra:
  run:
    dir: outputs/predict/${model.name}/${experiment.name}

train:
  segments:
    # - 20241113090990
    # - 0172_20241113090990
    # - 1667_w028_20251208130119156_2um
    # - 1667_w029_20251212185248662_2um
    # - 1667_w031_2025122323_2um
    - "0172_20241025145341"
    - "0172_20241025145701"
  accelerator: cuda
  use_validation_mask: false

  tta_num: 1

  compile: false
  compile_mode: default

  label_refinement: null
  mask_refinement: null

  precision: bf16-mixed

checkpoint: null