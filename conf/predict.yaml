defaults:
  - data/dataset@dataset: default
  - data/dataloader@dataloader: default
  - model: unetrpp # timesformer unetrpp vesuvius_unet vesuvius_resnet3d
  - path: predict
  - /aug@aug: tta
  - _self_

experiment:
  name: ${now:%Y-%m-%d_%H-%M-%S}
  jobid: ${oc.env:SLURM_JOB_ID,none}

hydra:
  run:
    dir: outputs/predict/${model.name}/${experiment.name}

train:
  segments:
    # - 20241113090990
    - 0172_20241113090990
    # - 1667_w028_20251208130119156_2um
    # - 1667_w029_20251212185248662_2um
    # - 1667_w031_2025122323_2um
  accelerator: cuda
  use_validation_mask: false

  tta_num: 1

  compile: false
  compile_mode: default

checkpoint: null